<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários e seus controles</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="Icor">Cor:</label>
            <input type="color" name="cor" id="cor" value="#ffffff">
        </p>

        <p>
            <label for="inivel">Nível de Satisfação</label>
            <input type="range" name="nivel" id="inivel" value="10" min="1" max="10">
        </p>
<!-- Quando for utilizar controle de envio de arquivos não se pode utiliza o método get apenas post -->
        <p>
            <label for="ifoto">Foto do Perfil</label>
            <input type="file" name="foto" id="foto">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
