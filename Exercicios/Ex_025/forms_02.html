<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
           <label for="Nome">Nome</label>
           <input type="text" name="nome" id="idnome" required minlength="4" maxlength="30" placeholder="Nome completo" autocomplete="name">
        </p>

        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="idmedia" required size="14" minlength="0" maxlength="10" step="0.1" placeholder="Nota de 0 a 10" >
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="idmes">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
