<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 200px;
            height: 200px;
            border: 3px solid rgb(5, 5, 5);
            border-collapse: collapse;
        }

        tr {
            background-color: rgb(255, 245, 233);
        }

        td {
            border: 1px solid black;
            padding: 2px;
            text-align: center;
            vertical-align:middle;
        }
        
    </style>

</head>
<body>
    <h1>Tabelas</h1>
    <!--Hierarquia de Tabelas
    Table - Tabela 
    Table Row - Linha da tabela
    Table Header - Cabeçalho da Tabela
    Table Data - Dado da Tabela-->

    <table> <!-- Tabela-->
        <tr> <!-- Primeira Linha (Table Row tr)-->
            <td>A1</td> <!--Table data (td)-->
            <td>B1</td> <!--Table data (td)-->
            <td>C1</td> <!--Table data (td)-->
        </tr>

        <tr> <!-- Segunda Linha (Table Row tr)-->
            <td>A2</td> <!--Table data (td)-->
            <td>B2</td> <!--Table data (td)-->
            <td>C2</td> <!--Table data (td)-->
        </tr>

        <tr> <!-- Terceira Linha (Table Row tr)-->
            <td>A3</td> <!--Table data (td)-->
            <td>B3</td> <!--Table data (td)-->
            <td>C3</td> <!--Table data (td)-->
        </tr>

        <tr> <!-- Quarta Linha(Table Row tr)-->
            <td>A4</td> <!--Table data (td)-->
            <td>B4</td> <!--Table data (td)-->
            <td>C4</td> <!--Table data (td)-->
        </tr>
    </table>
</body>
</html>
