<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container {
                    
            border: 5px solid rgba(12, 12, 12, 0.784);
            padding: 3px;

            display: grid;

            grid-template-rows: repeat(3, 1fr);
            grid-auto-rows: 1fr;

            grid-template-columns: repeat(3,1fr);
            grid-auto-columns: 1fr;

            grid-auto-flow: column;

            /* Versão compacta das propriedades template row e columns abaixo
            grid-template: repeat(3, auto) / repeat(3, auto); */
            
            gap:5px;

            /* align-items: start;
            justify-items: center;
            Versão compacta das propriedades items abaixo */
            place-items: normal normal;

            /* align-content: space-between;
            justify-content: center;
            Versão compacta das propriedades content abaixo */
            place-content: normal normal;
        }

        div.container__item {
            border: 2px dotted rgba(239, 48, 0, 0.978);
            border-radius: 5px;
            padding: 5px;

            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container__item">A</div>
        <div class="container__item">B</div>
        <div class="container__item">C</div>
        <div class="container__item">D</div>
        <div class="container__item">E</div>
        <div class="container__item">F</div>
        <div class="container__item">G</div>
        <div class="container__item">H</div>
        <div class="container__item">I</div>
        <div class="container__item">J</div>
    </div>
</body>
</html>
