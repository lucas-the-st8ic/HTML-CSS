<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container {
            border: 5px solid rgba(45, 45, 45, 0.784);
            padding: 3px;

            display: grid;
        }

        div.container__item {
            border: 2px dotted rgba(230, 174, 69, 0.768);
            margin: 4px;

            ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container__item">A</div>
        <div class="container__item">B</div>
        <div class="container__item">C</div>
        <div class="container__item">D</div>
        <div class="container__item">E</div>
        <div class="container__item">F</div>
        <div class="container__item">G</div>
    </div>
</body>
</html>
