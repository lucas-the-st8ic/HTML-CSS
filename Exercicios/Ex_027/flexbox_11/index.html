<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container {
            background-color: antiquewhite;

            display: flex;
            flex-flow: row nowrap;
        }

        div.container__item {
            background-color: burlywood;
            border: 1px solid black;

            flex-basis: 200px;
            flex-shrink: 1;

        }

        div#cxa {
            flex-shrink: 1;
            flex-grow: 0;
        }

        div#cxb {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxc {
            flex-shrink: 1;
            flex-grow: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="container__item" id="cxa" >A</div>
        <div class="container__item" id="cxb">B</div>
        <div class="container__item" id="cxc">C</div>
    </div>
</body>
</html>
