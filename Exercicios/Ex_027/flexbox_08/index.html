<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container {
            background-color: rgb(89, 152, 245);
            height: 400px;
            border-radius: 10px;
            margin: 10px;
            padding: 5px;

            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
        }

        div.container__item {
            background-color: rgb(220, 233, 252);
            border: 1px solid black;
            margin: 5px;
            padding: 20px;
            border-radius: 5px;
        }

        div#i1 {
            align-self: auto;
        }

        div#i2 {
            align-self: flex-start;
        }

        div#i3 {
            align-self: flex-end;
        }

        div#i4 {
            align-self: center;
        }

        div#i5 {
            align-self: stretch;
        }

        div#i6 {
            
        }

        div#i7 {
            
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="container__item" id="i1">A</div>
        <div class="container__item" id="i2">B</div>
        <div class="container__item" id="i3">C</div>
        <div class="container__item" id="i4">D</div>
        <div class="container__item" id="i5">E</div>
        <div class="container__item" id="i6">F</div>
        <div class="container__item" id="i7">G</div>
    </div>
</body>
</html>
