<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container {
            background-color: antiquewhite;

            display: flex;
        }

        div.container__item {
            background-color: burlywood;
            border: 1px solid black;

            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container__item" >A</div>
        <div class="container__item" >B</div>
        <div class="container__item" >C</div>
        <div class="container__item" >D</div>
        <div class="container__item" >E</div>
        <div class="container__item" >F</div>
        <div class="container__item" >G</div>
    </div>
</body>
</html>
