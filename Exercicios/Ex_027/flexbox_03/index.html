<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container {
            background-color: antiquewhite;
            
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        div.container__item {
            background-color: burlywood;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            margin: 5px;

            flex: auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="container__item" >Exemplo de bloco A</div>
        <div class="container__item" >Exemplo de bloco B</div>
        <div class="container__item" >Exemplo de bloco C</div>
        <div class="container__item" >Exemplo de bloco D</div>
        <div class="container__item" >Exemplo de bloco E</div>
        <div class="container__item" >Exemplo de bloco F</div>
        <div class="container__item" >Exemplo de bloco G</div>
    </div>
</body>
</html>
