<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin-left: 55px;
            text-shadow: 2px 2px 2px rgba(81, 81, 81, 0.559);
         }

        table {
            margin-left: 50px;
            border-collapse: collapse;
            width: 600px;
            border: 1.5px solid black;
        }

        thead {
            background-color: #949494;
            color: white;
            border: 1px solid black;
        }

        thead tr th {
            border: 1px solid black;
        }

        tbody th tr {
            border: 1px solid black;
        }

        tbody td {
            border: 1px solid black;
        }

        .notas {
            text-align: center;
        }
        .media__exatas {
            background-color: #949494;
            border: 1px solid black;
            color: white;
            text-align: left;
        }

        .media__humanas {
            background-color: #949494;
            border: 1px solid black;
            color: white;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Notas e médias do Aluno</h1>

    <table>
        <thead class="cabecalho">
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th scope="rowgroup">Nota 1</th>
                <th scope="rowgroup">Nota 2</th>
            </tr>
        </thead>
        <tbody class="corpo">
            <tr>
                <th class="exatas" rowspan="4" scope="rowgroup">Exatas</th>
                <td scope="colgroup">Matemática</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="colgroup">Física</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="colgroup">Química</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="colgroup">Biologia</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr class="media__exatas">
                <th colspan="4"> Média de Exatas
                </th>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td scope="colgroup">História</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="colgroup">Geografia</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
                <td class="notas">0.0</td>
            </tr>
            <tr class="media__humanas">
                <th colspan="4"> Média de Humanas
                </th>
                <td class="notas">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
